# Fixture analysis config. See docs/STATISTICAL_PROTOCOL.md for what each
# choice commits you to.
label: fixture analysis
unit_of_inference: world

metrics:
  - name: mean_loss
    column: loss
    estimator: mean
    level: event
    direction: lower_is_better
  - name: cvar90_loss
    column: loss
    estimator: cvar
    level: event
    params: {alpha: 0.9, tail: upper}
    direction: lower_is_better
  - name: success_rate
    column: mission_success
    estimator: mean
    level: resident
    direction: higher_is_better

aggregation:
  resident_to_event:
    loss: mean
    mission_success: mean
    travel_time: mean
    resource_use: sum
    responder_exposure: sum
  event_to_world:
    loss: mean
    mission_success: mean
  default_rule: mean

comparison:
  baseline: policy_a
  candidates: [policy_b]
  paired: true
  require_common_worlds: true

bootstrap:
  n_resamples: 1000
  cluster_level: world
  seed: 20260919
  confidence_level: 0.95
  method: percentile

equivalence:
  alpha: 0.05
  margins:
    mean_loss: 0.40
  non_inferiority: [mean_loss]

strata: [landscape, mobility, fire_regime, resource_level]

missing_data:
  policy: drop_record
  require_complete_worlds: true
  max_count_imbalance: 0.2

failure_column: failure_reason
