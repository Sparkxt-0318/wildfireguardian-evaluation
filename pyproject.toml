[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wg-eval"
version = "0.1.0"
description = "Independent statistical evaluation library for nested, paired, event-level experiment results."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "WildfireGuardian Evaluation" }]
keywords = ["statistics", "bootstrap", "equivalence", "pseudoreplication", "evaluation"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "scipy>=1.10"]

[project.scripts]
wg-eval = "wg_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
markers = [
    "slow: scenario replications and coverage studies (deselect with -m 'not slow')",
]
