name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Validate the committed fixtures
        run: |
          wg-eval validate-results tests/fixtures/paired_balanced.parquet \
            --config tests/fixtures/analysis.yaml --strict
      - name: Red-team scenarios must still trap and still be defended
        run: wg-eval redteam
